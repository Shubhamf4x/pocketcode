name: pocketcode
description: A focused, OpenCode-like chat client for configurable coding assistants.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_markdown: ^0.7.6
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  meta: ^1.16.0
  file_picker: ^10.3.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  adaptive_icon_background: '#0d0f10'
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  android: true
  ios: false

flutter:
  uses-material-design: true
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
